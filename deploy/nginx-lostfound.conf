# 百觅站点：HTTP 跳转 + HTTPS 反代
# 部署位置：/etc/nginx/conf.d/lostfound.conf
# 注意：部署前需先备份 /etc/nginx/sites-enabled/default，并禁用旧站 server 块

server {
    listen 80;
    listen [::]:80;
    server_name www.globalfinding.com globalfinding.com;

    # Let's Encrypt 续期校验
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.globalfinding.com globalfinding.com;

    # 使用已上传到 /home/cert 的正式证书（含中间证书链，SAN 覆盖两个域名）
    ssl_certificate     /home/cert/globalfinding.com.pem;
    ssl_certificate_key /home/cert/globalfinding.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;   # 与后端 spring.servlet.multipart.max-request-size 对齐
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    root /var/www/lostfound-web;
    index index.html;

    access_log /var/log/nginx/lostfound-access.log;
    error_log  /var/log/nginx/lostfound-error.log;

    # 后端 API：不带 URI 后缀的 proxy_pass，原样透传 /api/...
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # 上传图片静态资源（后端 WebConfig 映射 /uploads/**）
    # ^~ 必须：否则下方 ~* \.(png|jpg...) 正则会抢先匹配，导致图片 404
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 旧系统历史图片（/home/lostfound/image/YYYYMMDD/*.jpeg），旧数据引用 /image/... 路径
    # ^~ 必须：避免下方静态资源正则抢先匹配；alias 末尾斜杠不可省略
    location ^~ /image/ {
        alias /home/lostfound/image/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Web 前端 SPA 路由回退
    # 入口 HTML 必须每次校验：JS/CSS 带内容 hash 可长缓存，入口若被缓存会导致发布后仍加载旧包
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
