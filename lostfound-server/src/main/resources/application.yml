server:
  port: 8080
  # 生产环境通过 SERVER_ADDRESS=127.0.0.1 限制为仅本机，由 Nginx 反代；默认全网卡便于本地调试
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: lostfound-server
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lostfound}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

lostfound:
  wechat:
    # 微信小程序凭证：AppSecret 只通过环境变量注入，严禁写入代码仓库
    # 本地调试需自行设置 WX_SECRET（或配置 application-local.yml 并加入 .gitignore）
    appid: ${WX_APPID:wxb45bbe07cf07250c}
    secret: ${WX_SECRET:}
  jwt:
    # 生产环境务必通过环境变量注入
    secret: ${JWT_SECRET:LostFound-JWT-Secret-256bit-Key-Please-Change-In-Production!!}
    expire-hours: 72
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}
    # 图片最大边长（超出则等比压缩）
    max-edge: 1600
  qr-login:
    # 小程序码落地页需随小程序新版本发布；开发/体验版验证用 trial，正式版改为 release
    page: ${WX_QR_PAGE:pages/web-login/web-login}
    env-version: ${WX_QR_ENV_VERSION:trial}
    check-path: ${WX_QR_CHECK_PATH:false}
    ticket-ttl-seconds: ${QR_TICKET_TTL:300}
    max-tickets: ${QR_MAX_TICKETS:2000}
    rate-limit-per-minute: ${QR_RATE_LIMIT:10}
  site-invite:
    # 邀请码有效期；小程序码生成失败时前端自动降级为纯文本邀请码
    ttl-hours: ${SITE_INVITE_TTL_HOURS:24}
    page: ${WX_SITE_INVITE_PAGE:pages/manage/invite-accept}
    # 小程序新页面发布后使用 release；体验版联调可设为 trial
    env-version: ${WX_SITE_INVITE_ENV_VERSION:release}
  perf:
    # 查询性能开关：涉及结果集语义的项默认全部关闭，线上 survey + 结果集一致性校验通过后再按需开启
    # 全文粗召回（需先确认线上存在 ngram FULLTEXT 索引）；异常自动降级回原 LIKE
    fulltext-enabled: ${PERF_FULLTEXT_ENABLED:false}
    fulltext-min-keyword-length: ${PERF_FULLTEXT_MIN_KEYWORD_LENGTH:2}
    # 把 status <> 'OFFLINE' 改写为可见状态枚举 IN，让复合索引可做范围扫描；默认关闭以保证结果集完全一致
    status-enum-enabled: ${PERF_STATUS_ENUM_ENABLED:false}
    # 距离排序的经纬度 bounding box 下推；默认关闭，开启后只展示附近物品（total 随坐标变化）
    distance-bbox-enabled: ${PERF_DISTANCE_BBOX_ENABLED:false}
    distance-bbox-km: ${PERF_DISTANCE_BBOX_KM:50}
    # 缓存与可观测性（秒 / 毫秒）
    count-cache-seconds: ${PERF_COUNT_CACHE_SECONDS:30}
    latest-cache-seconds: ${PERF_LATEST_CACHE_SECONDS:300}
    stats-cache-seconds: ${PERF_STATS_CACHE_SECONDS:60}
    map-max-limit: ${PERF_MAP_MAX_LIMIT:100}
    slow-sql-ms: ${PERF_SLOW_SQL_MS:300}
    slow-sql-log-interval-seconds: ${PERF_SLOW_SQL_LOG_INTERVAL_SECONDS:10}

logging:
  level:
    com.lostfound: info
